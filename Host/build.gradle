// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {

    repositories {
        maven{setUrl("https://mirrors.tencent.com/nexus/repository/maven-public/")}
        maven {
            url "https://maven.aliyun.com/repository/jcenter"
        }
        maven {
            url "https://maven.aliyun.com/repository/google"
        }
        google()
        jcenter()
        mavenCentral() //必须
        mavenLocal()
    }

    ext {
        kotlin_version = '2.1.0'
        minSdkVersion = 23
        targetSdkVersion = 34
        compileSdkVersion = 34
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.demokiller.plugin:MyCustomGradlePlugin:1.0.0" // 依赖本地 Maven 仓库下的插件
        classpath "com.google.devtools.ksp:symbol-processing-gradle-plugin:2.1.0-1.0.29"
    }

}

allprojects {
    repositories {
        maven{setUrl("https://mirrors.tencent.com/nexus/repository/maven-public/")}
        maven {
            url "https://maven.aliyun.com/repository/jcenter"
        }
        maven {
            url "https://maven.aliyun.com/repository/google"
        }
        google()
        jcenter()
        mavenCentral()
        mavenLocal()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
